<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 64 64" style="enable-background:new 0 0 64 64;" xml:space="preserve">
  <defs>
    <linearGradient id="caciRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C60026"/>
      <stop offset="100%" stop-color="#8C001A"/>
    </linearGradient>
    <filter id="caciShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#C60026" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded shield background -->
  <rect x="6" y="6" width="52" height="52" rx="14" ry="14" fill="url(#caciRedGrad)" filter="url(#caciShadow)"/>
  <!-- Inner highlight -->
  <rect x="6" y="6" width="52" height="26" rx="14" ry="14" fill="#FFFFFF" opacity="0.08"/>
  <!-- White cross -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="32" y1="18" x2="32" y2="46"/>
    <line x1="22" y1="27" x2="42" y2="27"/>
  </g>
</svg>
