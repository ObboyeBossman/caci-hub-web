<!DOCTYPE html>
<html>
<head><style>
  body { font-family: Arial, sans-serif; }
  .header { background-color: #1E3A8A; color: white; padding: 20px; text-align: center; }
  .header .logo { color: #E63946; font-size: 24px; font-weight: bold; }
  .body { padding: 24px; }
  .membership { background: #f0f4ff; border-radius: 8px; padding: 12px; text-align: center; }
  .number { font-size: 20px; font-weight: bold; color: #1E3A8A; }
  .footer { background: #f5f5f5; padding: 12px; font-size: 12px; color: #666; text-align: center; }
</style></head>
<body>
  <div class="header"><div class="logo">CACI</div><div>Christ Apostolic Church International</div></div>
  <div class="body">
    <p>Dear {first_name},</p>
    <p>Welcome to Christ Apostolic Church International! Your membership has been registered.</p>
    <div class="membership">
      <p>Your Membership Number</p>
      <div class="number">{membership_number}</div>
    </div>
    <p>God bless you as you serve in our community.</p>
  </div>
  <div class="footer">Christ Apostolic Church International, Ghana</div>
</body>
</html>
