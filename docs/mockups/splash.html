  .arc-svg {

  }

    border-radius: 9999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 9999px;
    background: linear-gradient(
      90deg,
      var(--caci-red-light) 0%,
      rgba(232,0,58,0.6) 50%,
      var(--caci-red-light) 100%
    );
    background-size: 200% 100%;
    animation:
      bar-grow 3.5s cubic-bezier(0.4,0,0.2,1) forwards,
      shimmer-bar 1.4s linear infinite;
    width: 0%;
  }

  /* Status label */
  .status-label {

  }
