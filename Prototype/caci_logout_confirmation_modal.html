
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; }

.scene {
  min-height: 480px;
  background: #0d1117;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--border-radius-lg);
  padding: 32px 16px;
}

.modal {
  background: #161b22;
  border: 0.5px solid #30363d;
  border-radius: 16px;
  padding: 32px 28px 28px;
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.modal-icon-ring {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #1c1f26;
  border: 0.5px solid #30363d;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  color: #8b949e;
  font-size: 26px;
}

.modal-title {
  font-size: 20px;
  font-weight: 500;
  color: #e6edf3;
  text-align: center;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.modal-subtitle {
  font-size: 13px;
  color: #8b949e;
  text-align: center;
  line-height: 1.55;
  margin-bottom: 24px;
  max-width: 280px;
}

.user-card {
  width: 100%;
  background: #0d1117;
  border: 0.5px solid #30363d;
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.user-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1a2a3a;
  border: 0.5px solid #30363d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: #4D9FFF;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}

.user-info { flex: 1; min-width: 0; }

.user-name {
  font-size: 13px;
  font-weight: 500;
  color: #e6edf3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-asm {
  font-size: 11px;
  color: #8b949e;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 4px;
}

.session-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #3fb950;
  background: rgba(46,160,67,0.12);
  border: 0.5px solid rgba(46,160,67,0.25);
  border-radius: 20px;
  padding: 2px 8px;
  white-space: nowrap;
}

.modal-actions {
  display: flex;
  gap: 10px;
  width: 100%;
}

.btn {
  flex: 1;
  height: 40px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: opacity 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.btn:active { transform: scale(0.97); }

.btn-cancel {
  background: transparent;
  border: 0.5px solid #30363d;
  color: #e6edf3;
}

.btn-cancel:hover { background: #1c2128; }

.btn-logout {
  background: #A32D2D;
  color: #fff;
}

.btn-logout:hover { background: #791F1F; }

.btn-logout.confirming {
  background: #791F1F;
  opacity: 0.8;
  cursor: not-allowed;
}
</style>

<h2 class="sr-only">Logout confirmation dialog — confirm or cancel signing out of CACI Hub</h2>

<div class="scene">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <div class="modal-icon-ring">
      <i class="ti ti-logout" aria-hidden="true"></i>
    </div>

    <div class="modal-title" id="modal-title">Sign out of CACI Hub?</div>
    <div class="modal-subtitle">You'll need to select your assembly and sign in again to access your account.</div>

    <div class="user-card">
      <div class="user-avatar" id="user-initials">JA</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Joseph Asante</div>
        <div class="user-asm">
          <i class="ti ti-building-church" style="font-size:11px;flex-shrink:0" aria-hidden="true"></i>
          <span id="user-asm-name">Bethel Assembly, Accra</span>
        </div>
      </div>
      <div class="session-tag">
        <i class="ti ti-circle-check" style="font-size:11px" aria-hidden="true"></i>
        Active
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="btn-cancel">
        <i class="ti ti-x" style="font-size:15px" aria-hidden="true"></i>
        Cancel
      </button>
      <button class="btn btn-logout" id="btn-logout">
        <i class="ti ti-logout" style="font-size:15px" aria-hidden="true"></i>
        Sign out
      </button>
    </div>

  </div>
</div>

<script>
document.getElementById('btn-cancel').addEventListener('click', function() {
  sendPrompt('The user clicked Cancel on the logout dialog. What should happen next in the UI?');
});

const logoutBtn = document.getElementById('btn-logout');
logoutBtn.addEventListener('click', function() {
  logoutBtn.classList.add('confirming');
  logoutBtn.innerHTML = '<i class="ti ti-loader-2" style="font-size:15px;animation:spin 0.8s linear infinite" aria-hidden="true"></i> Signing out…';
  const style = document.createElement('style');
  style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
  document.head.appendChild(style);
  setTimeout(() => {
    sendPrompt('The user confirmed logout. How should I implement the _handleLogout function in Toolbar.ts to clear session and redirect?');
  }, 900);
});
</script>
